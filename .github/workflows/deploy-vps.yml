name: Deploy to VPS (Self-host)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deploy reason'
        required: false
        default: 'Manual dispatch'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (self-hosted runner on vps725503)
    runs-on: [self-hosted, deploy]
    timeout-minutes: 30

    env:
      CI: 'true'
      APPDIR: /srv/ybw-frontend
      # Canonical origin. Compared against the nested copy's own remote in the
      # [1c/6] purge guard, so both sides get normalised (`.git` suffix off)
      # before comparison -- the deployed checkout may carry either form.
      ORIGIN: 'https://github.com/blackie365/ybw-members-platform_dev'
      # The stray self-nested copy the [1c/6] purge step is allowed to delete.
      # A constant, never a workflow input, so this can only ever target this
      # one well-known path; it must stay equal to $APPDIR/$(basename $APPDIR),
      # which the step re-verifies (dirname + basename guards) before deleting.
      STRAY: /srv/ybw-frontend/ybw-frontend
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Sanity-check runner host and tooling
        run: |
          set -euo pipefail
          echo "hostname: $(hostname)"
          echo "whoami:   $(whoami)"
          echo "groups:   $(groups)"
          echo "APPDIR:   $APPDIR"
          ls -ld "$APPDIR" || { echo "Missing $APPDIR on runner!"; exit 1; }
          command -v git
          command -v pnpm
          command -v node && node --version
          cd /tmp && pnpm --version
          sudo -n true && echo "sudo: nopasswd OK" || { echo "sudo requires password - fix /etc/sudoers.d/gha-runner-ybw-deploy"; exit 1; }

      - name: report gha-runner sudo allowlist
        run: |
          # Diagnostic only — never fails the deploy. The gha-runner sudo
          # policy is an explicit command allowlist in
          # /etc/sudoers.d/gha-runner-ybw-deploy, and it is easy to guess
          # wrong: a binary that is not on it cannot prompt for a password
          # in a non-interactive step, so it just fails with "a terminal is
          # required to read the password". Every command added to this
          # workflow should be checked against the list below first.
          echo "--- sudo -n -l ---"
          sudo -n -l 2>&1 || echo "(sudo -n -l unavailable)"
          echo "--- per-binary probe ---"
          for b in git /bin/git /usr/bin/git /bin/cp /usr/bin/cp /bin/chown /bin/chmod \
                   /bin/tee /bin/cat /bin/rm /bin/mkdir /bin/install /bin/tar \
                   /usr/bin/ln /bin/ln /usr/bin/rsync /bin/rsync \
                   /bin/systemctl /usr/bin/systemctl /bin/systemd-analyze; do
            if sudo -n "$b" --version >/dev/null 2>&1; then
              echo "ALLOWED  $b"
            else
              echo "denied   $b"
            fi
          done

      - name: self-heal missing APPDIR .git
        run: |
          set -euo pipefail
          # NOTE: this step uses only `git`, which is known to be on the
          # gha-runner sudo allowlist (the fetch/reset step below relies on
          # it). `cp`/`test`/`umask` are NOT on it — see the allowlist step.
          if [ -d "$APPDIR/.git" ]; then
            echo "APPDIR/.git present — nothing to do"
            exit 0
          fi
          echo "WARNING: $APPDIR/.git is missing; every deploy fails at step 1"
          echo "         with 'fatal: not a git repository'. Re-initialising a"
          echo "         fresh repo; the fetch/reset step below repopulates the"
          echo "         whole worktree from origin, so nothing is lost."
          sudo git init -q "$APPDIR"
          sudo git -C "$APPDIR" remote add origin "$ORIGIN.git"
          sudo git config --global --add safe.directory "$APPDIR" 2>/dev/null || true
          echo "re-initialised: $(sudo git -C "$APPDIR" rev-parse --is-inside-work-tree 2>/dev/null || echo failed)"

      - name: git fetch origin/main + stage build + promote to APPDIR
        run: |
          set -euo pipefail
          APPDIR=/srv/ybw-frontend
          STAGEDIR=/srv/ybw-frontend-stage-${GITHUB_SHA::12}
          LOG="/tmp/ybw-frontend-deploy-$(date +%Y%m%d-%H%M%S).log"
          echo "=== $(date -Is): start deploy (reason: ${{ github.event.inputs.reason || 'push main' }}) ===" | tee -a "$LOG"

          sudo git config --global --add safe.directory "$APPDIR" 2>/dev/null || true

          echo "[1/7] git fetch origin/main into APPDIR metadata (sha=${GITHUB_SHA})" | tee -a "$LOG"
          OLDREV=$(sudo git -C "$APPDIR" rev-parse --short HEAD 2>/dev/null || echo "none")
          CREDFILE=/tmp/ybw-deploy-cred-${GITHUB_SHA}.txt
          trap 'sudo rm -f "$CREDFILE" 2>/dev/null || true' EXIT
          printf 'https://x-access-token:%s@github.com\n' "${GITHUB_TOKEN}" | sudo tee "$CREDFILE" >/dev/null
          sudo chmod 600 "$CREDFILE"
          sudo git -C "$APPDIR" -c "credential.helper=store --file=$CREDFILE" fetch --depth 1 origin main 2>&1 | tee -a "$LOG"
          sudo rm -f "$CREDFILE"
          sudo git -C "$APPDIR" cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null || { echo "FATAL: commit ${GITHUB_SHA} not available after fetch"; exit 2; }
          echo "old=$OLDREV target=${GITHUB_SHA::7}" | tee -a "$LOG"

          echo "[1b/7] purge stray root-level source duplicates" | tee -a "$LOG"
          for f in profile.ts ghost.ts firebase-admin.ts middleware.ts auth-utils.ts; do
            if [ -f "$APPDIR/$f" ]; then
              sudo rm -f "$APPDIR/$f"
              echo "removed stray root file: $f" | tee -a "$LOG"
            fi
          done

          echo "[1c/7] purge stray self-nested release copy ($STRAY)" | tee -a "$LOG"
          if [ -e "$STRAY" ] || [ -L "$STRAY" ]; then
            [ -L "$STRAY" ] && { echo "FATAL: $STRAY is a symlink - refusing"; exit 3; }
            [ -d "$STRAY" ] || { echo "FATAL: $STRAY is not a directory - refusing"; exit 3; }
            [ "$(readlink -f "$STRAY")" = "$STRAY" ] || { echo "FATAL: $STRAY does not resolve to itself - refusing"; exit 3; }
            [ "$(dirname "$STRAY")" = "$APPDIR" ] || { echo "FATAL: $STRAY is not a direct child of APPDIR - refusing"; exit 3; }
            [ "$(basename "$STRAY")" = "ybw-frontend" ] || { echo "FATAL: unexpected basename - refusing"; exit 3; }
            [ -f "$STRAY/.env.local" ] && { echo "FATAL: $STRAY contains .env.local - refusing"; exit 3; }
            sudo git config --global --add safe.directory "$STRAY" 2>/dev/null || true
            SREMOTE=$(sudo git -C "$STRAY" remote get-url origin 2>/dev/null || true)
            SREMOTE=${SREMOTE%.git}
            [ "$SREMOTE" = "$ORIGIN" ] || { echo "FATAL: $STRAY origin '$SREMOTE' != '$ORIGIN' - refusing"; exit 3; }
            SUDO_GIT="sudo git -C $STRAY"
            $SUDO_GIT fetch --quiet origin main 2>/dev/null || true
            SBEHIND=$($SUDO_GIT rev-list --count HEAD..FETCH_HEAD 2>/dev/null || echo 0)
            SAHEAD=$($SUDO_GIT rev-list --count FETCH_HEAD..HEAD 2>/dev/null || echo 0)
            echo "  nested HEAD=$($SUDO_GIT rev-parse --short HEAD) behind=$SBEHIND ahead=$SAHEAD" | tee -a "$LOG"
            [ "$SAHEAD" = "0" ] || { echo "FATAL: $STRAY has commits not on origin/main - refusing to purge"; exit 3; }
            LIVE_FILES_BEFORE=$(find "$APPDIR/uploads" -type f 2>/dev/null | wc -l)
            LIVE_INODES_BEFORE=$(find "$APPDIR/uploads" -type f -printf '%i\n' 2>/dev/null | sort -u | wc -l)
            echo "  purging $STRAY ($(du -sh "$STRAY" 2>/dev/null | cut -f1)); live uploads: $LIVE_FILES_BEFORE files / $LIVE_INODES_BEFORE inodes" | tee -a "$LOG"
            sudo /bin/rm -rf "$STRAY"
            [ -e "$STRAY" ] && { echo "FATAL: $STRAY still exists after purge"; exit 3; }
            LIVE_FILES_AFTER=$(find "$APPDIR/uploads" -type f 2>/dev/null | wc -l)
            LIVE_INODES_AFTER=$(find "$APPDIR/uploads" -type f -printf '%i\n' 2>/dev/null | sort -u | wc -l)
            [ "$LIVE_FILES_BEFORE" = "$LIVE_FILES_AFTER" ] && [ "$LIVE_INODES_BEFORE" = "$LIVE_INODES_AFTER" ] \
              || { echo "FATAL: live uploads changed ($LIVE_FILES_BEFORE/$LIVE_INODES_BEFORE -> $LIVE_FILES_AFTER/$LIVE_INODES_AFTER)"; exit 3; }
            echo "  purged OK; live uploads intact ($LIVE_FILES_AFTER files / $LIVE_INODES_AFTER inodes)" | tee -a "$LOG"
          else
            echo "  no stray nested copy present - nothing to do" | tee -a "$LOG"
          fi

          echo "[2/7] create staged worktree at $STAGEDIR" | tee -a "$LOG"
          sudo git -C "$APPDIR" worktree remove --force "$STAGEDIR" 2>/dev/null || true
          sudo /bin/rm -rf "$STAGEDIR" 2>/dev/null || true
          sudo git -C "$APPDIR" worktree prune 2>/dev/null || true
          sudo git -C "$APPDIR" worktree add --force --detach "$STAGEDIR" "${GITHUB_SHA}" 2>&1 | tee -a "$LOG"
          sudo git config --global --add safe.directory "$STAGEDIR" 2>/dev/null || true

          echo "[3/7] chown staged checkout to www-data" | tee -a "$LOG"
          sudo /bin/chown -R www-data:www-data "$STAGEDIR" || true
          sudo /bin/rm -f "$STAGEDIR/.env.local" 2>/dev/null || true
          [ -f "$APPDIR/.env.local" ] && sudo /usr/bin/ln -s "$APPDIR/.env.local" "$STAGEDIR/.env.local"
          sudo /bin/rm -rf "$STAGEDIR/uploads" 2>/dev/null || true
          [ -e "$APPDIR/uploads" ] && sudo /usr/bin/ln -s "$APPDIR/uploads" "$STAGEDIR/uploads"

          echo "[4/7] pnpm install in staged worktree" | tee -a "$LOG"
          sudo rm -f "$STAGEDIR/pnpm-workspace.yaml" 2>&1 | tee -a "$LOG" || true
          sudo -u www-data -H env CI=true pnpm -C "$STAGEDIR" install --shamefully-hoist --frozen-lockfile --prod=false 2>&1 | tee -a "$LOG" | tail -n 250

          echo "[5/7] pnpm build in staged worktree" | tee -a "$LOG"
          sudo pkill -9 -u www-data -f "next.*build|pnpm.*build|node.*build" 2>/dev/null || true
          sleep 3
          sudo /bin/sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true
          sudo find "$STAGEDIR/.next" -maxdepth 3 -type d -name export -prune -exec rm -rf {} + 2>/dev/null || true
          sudo rm -rf "$STAGEDIR/.next" "$STAGEDIR/.next/export" "$STAGEDIR/.next/cache" \
                 "$STAGEDIR/node_modules/.cache" "$STAGEDIR/.next/static" "$STAGEDIR/.next/server" "$STAGEDIR/.next/standalone" 2>/dev/null || true
          sudo rm -rf /tmp/.next-export* /tmp/next-export* 2>/dev/null || true
          sudo -u www-data mkdir -p "$STAGEDIR/.next" 2>/dev/null || true
          sudo /bin/chown -R www-data:www-data "$STAGEDIR/.next" "$STAGEDIR/node_modules" 2>/dev/null || true
          set +e
          BUILD_TIMEOUT_SECS="${YBW_BUILD_TIMEOUT_SECS:-720}"
          mkdir -p /tmp/ybw-deploy
          WATCHDOG=/tmp/ybw-deploy/build-watchdog-$$.json
          (
            sleep "$BUILD_TIMEOUT_SECS"
            sudo pkill -9 -u www-data -f "pnpm.*build|next.*build|jest-worker" 2>/dev/null || true
            printf '{"timedOut":true}' > "$WATCHDOG"
          ) &
          WATCHDOG_PID=$!
          sudo -u www-data -H \
            env \
              NODE_OPTIONS="--max-old-space-size=3584" \
              NEXT_TELEMETRY_DISABLED=1 \
              NEXT_PRIVATE_BUILD_WORKER_CONCURRENCY=1 \
              EXPERIMENTAL_CPU_COUNT=1 \
              CI=true \
              pnpm -C "$STAGEDIR" build 2>&1 | tee -a "$LOG" | tail -n 250
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          [ "$(cat "$WATCHDOG" 2>/dev/null || echo '{"timedOut":false}')" = '{"timedOut":false}' ] \
            && kill "$WATCHDOG_PID" 2>/dev/null || true
          sudo pkill -9 -u www-data -f "next/dist/compiled/jest-worker/processChild.js" 2>/dev/null || true
          sudo pkill -9 -u www-data -f "next.*build|pnpm.*build|jest-worker" 2>/dev/null || true
          rm -f "$WATCHDOG"
          sudo find "$STAGEDIR/.next" -maxdepth 3 -type d -name export -prune -exec rm -rf {} + 2>/dev/null || true
          sudo rm -rf "$STAGEDIR/.next/export" 2>/dev/null || true
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "FATAL: pnpm build exit=$BUILD_EXIT" | tee -a "$LOG"
            exit "$BUILD_EXIT"
          fi

          echo "[6/7] promote staged build into APPDIR + restart ybw-frontend" | tee -a "$LOG"
          sudo /bin/systemctl stop ybw-frontend.service 2>/dev/null || true
          sudo git -C "$APPDIR" -c advice.detachedHead=false reset --hard "${GITHUB_SHA}" 2>&1 | tee -a "$LOG"
          NEWREV=$(sudo git -C "$APPDIR" rev-parse --short HEAD)
          echo "promote old=$OLDREV new=$NEWREV expected=${GITHUB_SHA::7}" | tee -a "$LOG"
          [ "$(sudo git -C "$APPDIR" rev-parse HEAD)" = "${GITHUB_SHA}" ] || { echo "FATAL: APPDIR HEAD != GITHUB_SHA after reset"; exit 2; }
          sudo /usr/bin/rsync -a --delete "$STAGEDIR/node_modules/" "$APPDIR/node_modules/" 2>&1 | tee -a "$LOG" | tail -n 120
          sudo /bin/rm -rf "$APPDIR/.next" 2>/dev/null || true
          sudo /usr/bin/rsync -a --delete "$STAGEDIR/.next/" "$APPDIR/.next/" 2>&1 | tee -a "$LOG" | tail -n 120

          echo "[6b/7] systemctl restart ybw-frontend (+ ybw-frontend-tls when present)" | tee -a "$LOG"
          sudo /bin/chown -R www-data:www-data "$APPDIR/.next" "$APPDIR/node_modules" 2>&1 || true
          sudo /bin/systemctl reset-failed ybw-frontend.service 2>/dev/null || true
          sudo /bin/systemctl restart ybw-frontend.service 2>&1 | tee -a "$LOG"
          (sudo systemctl list-unit-files 2>/dev/null | grep -qs ybw-frontend-tls) \
            && (sudo /bin/systemctl reset-failed ybw-frontend-tls.service 2>/dev/null || true ; sudo /bin/systemctl restart ybw-frontend-tls.service 2>&1 | tee -a "$LOG") \
            || true

          sleep 6

          echo "[6c/7] status + local health probe:" | tee -a "$LOG"
          sudo /bin/systemctl --no-pager is-active ybw-frontend.service 2>&1 | tee -a "$LOG"
          sudo /bin/systemctl --no-pager is-active ybw-frontend-tls.service 2>&1 | tee -a "$LOG" || true
          curl -fsS -I --max-time 10 http://127.0.0.1:3003/ 2>&1 | tee -a "$LOG"

          MAINPID=$(sudo systemctl show -p MainPID --value ybw-frontend.service)
          echo "MAIN_PID=$MAINPID" | tee -a "$LOG"
          echo "=== $(date -Is): deploy OK <== ($OLDREV -> $NEWREV, pid=$MAINPID)" | tee -a "$LOG"

          echo "[7/7] clean up staged worktree" | tee -a "$LOG"
          sudo git -C "$APPDIR" worktree remove --force "$STAGEDIR" 2>/dev/null || true
          sudo git -C "$APPDIR" worktree prune 2>/dev/null || true

      - name: Install + enable weekly newsletter systemd timer
        run: |
          set -euo pipefail
          APPDIR=/srv/ybw-frontend
          # The VPS-local timer is the guaranteed weekly sender; the GitHub
          # Actions cron (11:11 UTC Wed) is the cross-region backup. Both hit
          # the same atomic-dedup endpoint, so whichever fires first sends and
          # the other is a no-op.
          #
          # Unit files are written with `tee < src` rather than `cp`: the
          # gha-runner sudo allowlist permits tee/chmod/chown/rm/mkdir/git/
          # systemctl but NOT cp/cat/install/tar (see the allowlist step).
          sudo /bin/tee /etc/systemd/system/ybw-newsletter.service \
            < "$APPDIR/deploy/ybw-newsletter.service" >/dev/null
          sudo /bin/tee /etc/systemd/system/ybw-newsletter.timer \
            < "$APPDIR/deploy/ybw-newsletter.timer" >/dev/null
          sudo /bin/chown root:root /etc/systemd/system/ybw-newsletter.{service,timer}
          sudo /bin/chmod 0644 /etc/systemd/system/ybw-newsletter.{service,timer}
  
          # Rotate the secret used by the timer service on every deploy so the
          # file always matches the repo secret. Root-only read, via the same
          # tee + chmod 600 pattern already used for CREDFILE above.
          # (Deliberately NOT `sudo umask`, which cannot work: umask is a shell
          # builtin, not a binary sudo can exec.)
          printf 'CRON_SECRET=%s\n' "${CRON_SECRET}" | sudo /bin/tee /etc/ybw-newsletter.env >/dev/null
          sudo /bin/chown root:root /etc/ybw-newsletter.env
          sudo /bin/chmod 600 /etc/ybw-newsletter.env
  
          sudo /bin/systemctl daemon-reload
          sudo /bin/systemctl enable ybw-newsletter.timer
          sudo /bin/systemctl start  ybw-newsletter.timer
  
          echo "timer state:"
          sudo /bin/systemctl --no-pager is-active ybw-newsletter.timer
          sudo /bin/systemctl --no-pager is-enabled ybw-newsletter.timer
          sudo /bin/systemctl --no-pager list-timers ybw-newsletter.timer
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
  
      - name: Install + enable daily social queue timer
        run: |
          set -euo pipefail
          APPDIR=/srv/ybw-frontend
          # Queues the next unposted article and emails it for approval every
          # morning. Publishing stays off until SOCIAL_PUBLISH_ENABLED=true is
          # added to <APPDIR>/.env.local, so this is safe to enable now.
          sudo /bin/tee /etc/systemd/system/ybw-social-queue.service \
            < "$APPDIR/deploy/ybw-social-queue.service" >/dev/null
          sudo /bin/tee /etc/systemd/system/ybw-social-queue.timer \
            < "$APPDIR/deploy/ybw-social-queue.timer" >/dev/null
          sudo /bin/chown root:root /etc/systemd/system/ybw-social-queue.{service,timer}
          sudo /bin/chmod 0644 /etc/systemd/system/ybw-social-queue.{service,timer}
  
          printf 'CRON_SECRET=%s\n' "${CRON_SECRET}" | sudo /bin/tee /etc/ybw-social.env >/dev/null
          sudo /bin/chown root:root /etc/ybw-social.env
          sudo /bin/chmod 600 /etc/ybw-social.env
  
          sudo /bin/systemctl daemon-reload
          sudo /bin/systemctl enable ybw-social-queue.timer
          sudo /bin/systemctl start  ybw-social-queue.timer
  
          echo "social timer state:"
          sudo /bin/systemctl --no-pager is-active ybw-social-queue.timer
          sudo /bin/systemctl --no-pager is-enabled ybw-social-queue.timer
          sudo /bin/systemctl --no-pager list-timers ybw-social-queue.timer
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
