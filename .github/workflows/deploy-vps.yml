name: Deploy to VPS (Self-host)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deploy reason'
        required: false
        default: 'Manual dispatch'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (self-hosted runner on vps725503)
    runs-on: [self-hosted, deploy]
    timeout-minutes: 30

    env:
      CI: 'true'
      APPDIR: /srv/ybw-frontend
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Sanity-check runner host and tooling
        run: |
          set -euo pipefail
          echo "hostname: $(hostname)"
          echo "whoami:   $(whoami)"
          echo "groups:   $(groups)"
          echo "APPDIR:   $APPDIR"
          ls -ld "$APPDIR" || { echo "Missing $APPDIR on runner!"; exit 1; }
          command -v git
          command -v pnpm
          command -v node && node --version
          cd /tmp && pnpm --version
          sudo -n true && echo "sudo: nopasswd OK" || { echo "sudo requires password - fix /etc/sudoers.d/gha-runner-ybw-deploy"; exit 1; }

      - name: git fetch origin/main + reset APPDIR to ${{ github.sha }}
        run: |
          set -euo pipefail
          APPDIR=/srv/ybw-frontend
          LOG="/tmp/ybw-frontend-deploy-$(date +%Y%m%d-%H%M%S).log"
          echo "=== $(date -Is): start deploy (reason: ${{ github.event.inputs.reason || 'push main' }}) ===" | tee -a "$LOG"

          sudo git config --global --add safe.directory "$APPDIR" 2>/dev/null || true

          echo "[1/6] git fetch + reset hard to origin/main (sha=${GITHUB_SHA})" | tee -a "$LOG"
          OLDREV=$(sudo git -C "$APPDIR" rev-parse --short HEAD)
          # The repo is private and origin is HTTPS, so an anonymous fetch fails
          # ("could not read Username"). Authenticate with the Actions token via a
          # one-off store credential file: the token never lands in the repo config
          # or the deploy log, and is removed after the fetch.
          CREDFILE=/tmp/ybw-deploy-cred-${GITHUB_SHA}.txt
          trap 'sudo rm -f "$CREDFILE" 2>/dev/null || true' EXIT
          printf 'https://x-access-token:%s@github.com\n' "${GITHUB_TOKEN}" | sudo tee "$CREDFILE" >/dev/null
          sudo chmod 600 "$CREDFILE"
          sudo git -C "$APPDIR" -c "credential.helper=store --file=$CREDFILE" fetch --depth 1 origin main 2>&1 | tee -a "$LOG"
          sudo rm -f "$CREDFILE"
          sudo git -C "$APPDIR" -c advice.detachedHead=false reset --hard "${GITHUB_SHA}" 2>&1 | tee -a "$LOG"
          NEWREV=$(sudo git -C "$APPDIR" rev-parse --short HEAD)
          echo "old=$OLDREV new=$NEWREV expected=${GITHUB_SHA::7}" | tee -a "$LOG"
          [ "$(sudo git -C "$APPDIR" rev-parse HEAD)" = "${GITHUB_SHA}" ] || { echo "FATAL: APPDIR HEAD != GITHUB_SHA"; exit 2; }

          echo "[1b/6] purge stray root-level source duplicates (untracked leftovers from past manual sessions; next build type-checks them and they fall out of date with src/)" | tee -a "$LOG"
          for f in profile.ts ghost.ts firebase-admin.ts middleware.ts auth-utils.ts; do
            if sudo test -f "$APPDIR/$f"; then
              sudo rm -f "$APPDIR/$f"
              echo "removed stray root file: $f" | tee -a "$LOG"
            fi
          done

          echo "[2/6] chown checkout to www-data" | tee -a "$LOG"
          sudo /bin/chown -R www-data:www-data "$APPDIR" || true

          echo "[3/6] pnpm install (frozen lockfile, shamefully-hoist, non-interactive CI mode)" | tee -a "$LOG"
          sudo rm -f "$APPDIR/pnpm-workspace.yaml" 2>&1 | tee -a "$LOG" || true
          sudo -u www-data -H env CI=true pnpm -C "$APPDIR" install --shamefully-hoist --frozen-lockfile --prod=false 2>&1 | tee -a "$LOG" | tail -n 250

          echo "[4/6] pnpm build (max-old-space 3584 MB, purge stale ISR/cache)" | tee -a "$LOG"
          echo "[4a/6] kill any stale www-data build workers + purge .next + export leftovers everywhere" | tee -a "$LOG"
          # Aggressively free resident memory before the build: (a) reap any
          # www-data build / next / jest orphans from prior runs and (b) stop
          # the running ybw-frontend.service during build so its 200-500 MB
          # Node RSS goes back to the OS. The VPS only has 3.7 GiB RAM and
          # without this stop Next.js 84-page static generation regularly
          # trips the Linux OOM killer (exit 137) at static page ~42/84.
          # Service is restarted later in step [6/6].
          sudo /bin/systemctl stop ybw-frontend.service 2>/dev/null || true
          sudo pkill -9 -u www-data -f "next.*build|pnpm.*build|node.*build" 2>/dev/null || true
          sudo pkill -9 -u www-data -f "next-server|node.*server" 2>/dev/null || true
          sleep 3
          # Drop the kernel page cache / dentries / inodes that the prior
          # running Next server + node_modules stat storms accumulated into
          # the buffer cache; harmless, gives ~200-400 MB back immediately.
          sudo /bin/sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true
          sudo find "$APPDIR/.next" -maxdepth 3 -type d -name export -prune -exec rm -rf {} + 2>/dev/null || true
          sudo rm -rf "$APPDIR/.next" "$APPDIR/.next/export" "$APPDIR/.next/cache" \
                 "$APPDIR/node_modules/.cache" "$APPDIR/.next/static" "$APPDIR/.next/server" "$APPDIR/.next/standalone" 2>/dev/null || true
          sudo rm -rf /tmp/.next-export* /tmp/next-export* 2>/dev/null || true
          sudo -u www-data mkdir -p "$APPDIR/.next" 2>/dev/null || true
          sudo /bin/chown -R www-data:www-data "$APPDIR/.next" "$APPDIR/node_modules" 2>/dev/null || true
          set +e
          # Build under a watchdog: Next can spawn detached jest-worker
          # processes (processChild.js) that, if the build stalls, hang for
          # days and starve this 3.8GB box (see 2026-09-01 outage). Time-box
          # the build and kill the whole www-data build tree on any exit.
          BUILD_TIMEOUT_SECS="${YBW_BUILD_TIMEOUT_SECS:-720}"
          mkdir -p /tmp/ybw-deploy
          WATCHDOG=/tmp/ybw-deploy/build-watchdog-$$.json
          (
            sleep "$BUILD_TIMEOUT_SECS"
            sudo pkill -9 -u www-data -f "pnpm.*build|next.*build|jest-worker" 2>/dev/null || true
            printf '{"timedOut":true}' > "$WATCHDOG"
          ) &
          WATCHDOG_PID=$!

          # Build memory tuning for 3.7 GiB VPS — prevent webpack / turbopack
          # worker spawning from exhausting resident RAM and being shot by
          # the OOM killer at static generation phase (exit 137, the actual
          # root cause of PR #530 deploy RUN 35329004583 failure on
          # 2026-09-18). NODE_OPTIONS heap raised to 3584 MB; worker cpus
          # forced to 1; telemetry disabled; SWC minify off (faster + less
          # RSS); webpack memory-limit enforced.
          sudo -u www-data -H \
            env \
              NODE_OPTIONS="--max-old-space-size=3584" \
              NEXT_TELEMETRY_DISABLED=1 \
              NEXT_PRIVATE_BUILD_WORKER_CONCURRENCY=1 \
              EXPERIMENTAL_CPU_COUNT=1 \
              CI=true \
              pnpm -C "$APPDIR" build 2>&1 | tee -a "$LOG" | tail -n 250
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          # Stop the watchdog if the build finished first; then always reap
          # any orphaned build workers so none can starve the box.
          [ "$(cat "$WATCHDOG" 2>/dev/null || echo '{"timedOut":false}')" = '{"timedOut":false}' ] \
            && kill "$WATCHDOG_PID" 2>/dev/null || true
          sudo pkill -9 -u www-data -f "next/dist/compiled/jest-worker/processChild.js" 2>/dev/null || true
          sudo pkill -9 -u www-data -f "next.*build|pnpm.*build|jest-worker" 2>/dev/null || true
          rm -f "$WATCHDOG"

          echo "[4b/6] post-build purge any leftover .next/export partial dirs (ENOENT rename defense)" | tee -a "$LOG"
          sudo find "$APPDIR/.next" -maxdepth 3 -type d -name export -prune -exec rm -rf {} + 2>/dev/null || true
          sudo rm -rf "$APPDIR/.next/export" 2>/dev/null || true
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "FATAL: pnpm build exit=$BUILD_EXIT" | tee -a "$LOG"
            exit "$BUILD_EXIT"
          fi

          echo "[5/6] chown build artifacts" | tee -a "$LOG"
          sudo /bin/chown -R www-data:www-data "$APPDIR/.next" "$APPDIR/node_modules" 2>&1 || true

          echo "[6/6] systemctl restart ybw-frontend (+ ybw-frontend-tls when present)" | tee -a "$LOG"
          # Defense-in-depth: if the unit previously crash-looped past its
          # StartLimitBurst (e.g. NRestarts=22669 that caused the 2026-09-20
          # HTTP 502 outage), `systemctl restart` silently refuses to start
          # it. Reset the rate-limit counters BEFORE restart so a successful
          # deploy can always bring the service back up regardless of how
          # badly the prior unit crashed.
          sudo /bin/systemctl reset-failed ybw-frontend.service 2>/dev/null || true
          sudo /bin/systemctl restart ybw-frontend.service 2>&1 | tee -a "$LOG"
          (sudo systemctl list-unit-files 2>/dev/null | grep -qs ybw-frontend-tls) \
            && (sudo /bin/systemctl reset-failed ybw-frontend-tls.service 2>/dev/null || true ; sudo /bin/systemctl restart ybw-frontend-tls.service 2>&1 | tee -a "$LOG") \
            || true

          sleep 6

          echo "status:" | tee -a "$LOG"
          sudo /bin/systemctl --no-pager is-active ybw-frontend.service 2>&1 | tee -a "$LOG"
          sudo /bin/systemctl --no-pager is-active ybw-frontend-tls.service 2>&1 | tee -a "$LOG" || true

          MAINPID=$(sudo systemctl show -p MainPID --value ybw-frontend.service)
          echo "MAIN_PID=$MAINPID" | tee -a "$LOG"
          echo "=== $(date -Is): deploy OK <== ($OLDREV -> $NEWREV, pid=$MAINPID)" | tee -a "$LOG"
