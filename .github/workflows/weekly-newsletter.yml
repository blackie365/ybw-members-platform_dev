name: Weekly Newsletter Email

on:
  schedule:
    # Wednesday 11:00 GMT (UTC)
    - cron: "0 11 * * 3"
  workflow_dispatch:

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  send:
    name: Send weekly newsletter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger weekly newsletter send
        env:
          CRON_URL: ${{ vars.NEWSLETTER_CRON_URL || 'https://yorkshirebusinesswoman.co.uk' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          : "${CRON_SECRET:?Set the CRON_SECRET repository secret so the cron can authenticate with the app (must match CRON_SECRET in /srv/ybw-frontend/.env.local).}"

          echo "Calling ${CRON_URL%/}/api/cron/daily-newsletter (POST, Bearer-authenticated)"
          code="$(curl -sS -o /tmp/weekly-newsletter-response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -X POST \
            "${CRON_URL%/}/api/cron/daily-newsletter")"

          echo "HTTP $code"
          cat /tmp/weekly-newsletter-response.json
          echo

          [ "$code" = "200" ] || { echo "Weekly newsletter send failed."; exit 1; }