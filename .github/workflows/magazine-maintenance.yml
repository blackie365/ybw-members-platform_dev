name: Magazine Maintenance (manual)

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Repo-relative script path to run (pnpm exec tsx, as www-data in the app dir)'
        required: false
        default: 'scripts/magazine-set-feature-image.ts'
        type: string
      script_args:
        description: 'Args passed to the script (space-separated)'
        required: false
        default: '--dry-run'
        type: string
      appdir:
        description: 'Path to the deployed app (leave default)'
        required: false
        default: '/srv/ybw-frontend'
        type: string

concurrency:
  group: magazine-maintenance
  cancel-in-progress: true

jobs:
  run:
    name: Run maintenance script (self-hosted runner on vps725503)
    runs-on: [self-hosted, deploy]
    timeout-minutes: 20

    env:
      APPDIR: '/srv/ybw-frontend'

    steps:
      - name: Sanity-check runner host + sudo
        run: |
          set -euo pipefail
          echo "hostname: $(hostname)"
          echo "whoami:   $(whoami)"
          ls -ld "$APPDIR"
          sudo -n true || { echo "sudo requires password - maintenance needs nopasswd sudo like deploy"; exit 1; }

      - name: Run maintenance script as www-data (prod .env.local)
        env:
          SCRIPT: ${{ github.event.inputs.script }}
          ARGS: ${{ github.event.inputs.script_args }}
        run: |
          set -euo pipefail
          SCRIPT="${SCRIPT:-scripts/magazine-set-feature-image.ts}"
          ARGS="${ARGS:---dry-run}"
          echo "Running: tsx ${SCRIPT} ${ARGS}"
          # The scripts call dotenv.config('.env.local'), so we must NOT
          # bash-source the file (dotenv lines are not always valid shell).
          set -f
          sudo -u www-data -H bash -lc 'cd /srv/ybw-frontend && CI=true pnpm exec tsx "$0" "$@"' "$SCRIPT" ${ARGS}
          set +f

      - name: Report
        run: |
          echo "Maintenance dispatch finished. If --apply was used, reader routes regenerate via their own ISR (revalidate=60)."